<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOO TV - HTML5 App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Leitor de Vídeo em Ecrã Inteiro */
    #video-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* OSD (On-Screen Display / Informação do Canal) */
    #osd {
      position: absolute;
      top: 40px;
      right: 40px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #e20074; /* Cor de destaque */
      border-radius: 8px;
      padding: 15px 25px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    #osd.active {
      opacity: 1;
    }

    #osd-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #e20074;
    }

    #osd-name {
      font-size: 1.5rem;
    }

    /* Indicador do buffer do número introduzido */
    #num-input-display {
      position: absolute;
      top: 40px;
      left: 40px;
      background: rgba(226, 0, 116, 0.9);
      color: #fff;
      font-size: 3rem;
      font-weight: bold;
      padding: 10px 25px;
      border-radius: 8px;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body tabindex="0">

  <video id="video-player" autoplay playsinline muted></video>

  <div id="osd">
    <div id="osd-number">1</div>
    <div id="osd-name">Carregando...</div>
  </div>

  <div id="num-input-display"></div>

  <script>
    // Lista de canais de exemplo (Substitua as URLs pelas suas streams)
    const canais = [
      { id: 1, name: "Canal 1 - Exemplo HD", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { id: 2, name: "Canal 2 - Exemplo Stream", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
      { id: 3, name: "Canal 3 - Exemplo Natureza", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
    ];

    let canalAtualIndex = 0;
    let osdTimeout = null;
    let inputBuffer = "";
    let inputBufferTimeout = null;

    const player = document.getElementById('video-player');
    const osd = document.getElementById('osd');
    const osdNumber = document.getElementById('osd-number');
    const osdName = document.getElementById('osd-name');
    const numDisplay = document.getElementById('num-input-display');

    // Inicialização da App
    window.addEventListener('load', () => {
      document.body.focus();
      carregarCanal(canalAtualIndex);
    });

    // Garante que o foco permanece na página se o utilizador clicar no ecrã
    document.addEventListener('click', () => {
      document.body.focus();
    });

    // Mapeamento Global de Teclas para o Comando SDMC-DV9161 (Android TV)
    document.addEventListener('keydown', (event) => {
      const code = event.keyCode || event.which;
      const key = event.key;

      // 1. Mudar para o Canal SEGUINTE (Seta Cima, CH+, PageUp)
      if (key === 'ArrowUp' || code === 38 || code === 33 || code === 427) {
        event.preventDefault();
        proximoCanal();
      }

      // 2. Mudar para o Canal ANTERIOR (Seta Baixo, CH-, PageDown)
      else if (key === 'ArrowDown' || code === 40 || code === 34 || code === 428) {
        event.preventDefault();
        canalAnterior();
      }

      // 3. Teclas Numéricas (0-9) - Teclado numérico físico ou do comando
      else if ((code >= 48 && code <= 57) || (code >= 96 && code <= 105)) {
        event.preventDefault();
        const num = code >= 96 ? code - 96 : code - 48;
        processarDigitoNumerico(num);
      }

      // 4. Tecla OK / Enter (Mostrar OSD)
      else if (key === 'Enter' || code === 13) {
        event.preventDefault();
        mostrarOSD();
      }
    });

    function carregarCanal(index) {
      if (index < 0 || index >= canais.length) return;
      
      canalAtualIndex = index;
      const canal = canais[canalAtualIndex];

      player.src = canal.url;
      player.play().catch(err => console.log("Erro de reprodução:", err));

      osdNumber.innerText = canal.id;
      osdName.innerText = canal.name;
      mostrarOSD();
    }

    function proximoCanal() {
      let novoIndex = canalAtualIndex + 1;
      if (novoIndex >= canais.length) novoIndex = 0; // Volta ao primeiro
      carregarCanal(novoIndex);
    }

    function canalAnterior() {
      let novoIndex = canalAtualIndex - 1;
      if (novoIndex < 0) novoIndex = canais.length - 1; // Vai para o último
      carregarCanal(novoIndex);
    }

    function processarDigitoNumerico(digito) {
      inputBuffer += digito;
      numDisplay.innerText = inputBuffer;
      numDisplay.style.display = 'block';

      clearTimeout(inputBufferTimeout);

      // Espera 1.5s após o último dígito premido para mudar para o canal pretendido
      inputBufferTimeout = setTimeout(() => {
        const numeroProcurado = parseInt(inputBuffer, 10);
        const indexEncontrado = canais.findIndex(c => c.id === numeroProcurado);

        if (indexEncontrado !== -1) {
          carregarCanal(indexEncontrado);
        } else {
          mostrarOSD();
          osdName.innerText = "Canal não encontrado";
        }

        inputBuffer = "";
        numDisplay.style.display = 'none';
      }, 1500);
    }

    function mostrarOSD() {
      osd.classList.add('active');
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => {
        osd.classList.remove('active');
      }, 4000); // Esconde o OSD após 4 segundos
    }
  </script>
</body>
</html>
